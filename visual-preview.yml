schema: 1
plugin: ArcVotes
minecraft-version: '1.21.11'
minecraft-client-sha1: ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd
gallery-accent: '#ffb86b'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

custom-items:
  arc:background:
    material: GRAY_STAINED_GLASS_PANE
    model: assets/arc/models/gui/background.json

glyphs:
  - character: '💰'
    path: '@pack/assets/arc/textures/glyphs/coin.png'
    height: 9
    ascent: 8
  - character: ''
    path: '@pack/assets/arc/textures/glyphs/premium_token.png'
    height: 9
    ascent: 8

sources:
  votes:
    path: src/main/resources/lang/ru.yml
    prefix-key: prefix
    exclude: [prefix, commands.vote-state-voted, commands.vote-state-open, reward.component-standard, reward.component-premium, reward.component-spacing]

placeholders:
  name: MonitoringMinecraft
  minecraft_rating: '<#ffc857><underlined>MinecraftRating</underlined></color>'
  minecraft_rating_state: '<#8fe1c2><bold>✔</bold></color>'
  hotmc: '<#ff5f56><underlined>HotMC</underlined></color>'
  hotmc_state: '<#ffc98c>◇</color>'
  monitoring_minecraft: '<#43d995><underlined>MonitoringMinecraft</underlined></color>'
  monitoring_minecraft_state: '<#8fe1c2><bold>✔</bold></color>'
  game_monitoring: '<#b784ff><underlined>GameMonitoring</underlined></color>'
  game_monitoring_state: '<#ffc98c>◇</color>'
  site: '<#ff5f56>HotMC</color>'
  fields: ': http.port'
  amount: '1000'
  rewards: '<#4de3a2>+1000</color> <white>💰</white> <#ffd166>+3</color> <white></white>'
  mysql: '<#2bba43>✔ работает</color>'
  reward: '<#2bba43>✔ работает</color>'
  callback: '<#2bba43>✔ работает</color>'
  source_count: '4'
  accepted: '128'
  duplicates: '7'
  rejected: '3'
  upstream_failures: '1'
  player: 'SPRUcraft_1996'
  voted_count: '2'
  total_count: '4'
  check_minecraft_rating: 'MinecraftRating'
  check_hotmc: 'HotMC'
  check_monitoring_minecraft: 'MonitoringMinecraft'
  check_game_monitoring: 'GameMonitoring'
  count: '17'
  page: '2'
  pages: '3'
  maximum: '1000'
  index: '9'
  date: '31.08 15:17'
  history_site: 'MonitoringMinecraft'
  history_state: '<#2bba43>✔ выдана</color>'
  previous: '<#92bed8><underlined>◀ Назад</underlined></color>'
  next: '<#92bed8><underlined>Вперёд ▶</underlined></color>'
  total: '42'

surfaces:
  fragments:
    - source: votes
      include: [sites.*, gui.site-*, gui.spacer]

  chat:
    - source: votes
      include:
        - commands.*
        - gui.open-message
        - reward.granted

  inventories:
    - id: vote-sites-loading
      title: votes:gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - {slot: 11, material: CLOCK, name: votes:gui.loading-name, lore: votes:gui.loading-lore, placeholders: {site: '<#ffc857>MinecraftRating'}}
        - {slot: 13, material: CLOCK, name: votes:gui.loading-name, lore: votes:gui.loading-lore, placeholders: {site: '<#ff5f56>HotMC'}}
        - {slot: 15, material: CLOCK, name: votes:gui.loading-name, lore: votes:gui.loading-lore, placeholders: {site: '<#43d995>MonitoringMinecraft'}}

    - id: vote-sites-history
      title: votes:gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 11
          material: GOLD_INGOT
          name: votes:sites.minecraft-rating
          placeholders: {name: MinecraftRating}
          lore:
            - votes:gui.site-status-voted
            - {ref: votes:gui.site-total, placeholders: {total: '42'}}
            - votes:gui.spacer
            - votes:gui.site-history-title
            - {ref: votes:gui.site-history-row, placeholders: {date: '31.08.2026 в 15:17'}}
            - {ref: votes:gui.site-history-row, placeholders: {date: '30.08.2026 в 23:10'}}
            - votes:gui.spacer
            - votes:gui.site-action
        - slot: 13
          material: REDSTONE
          name: votes:sites.hotmc
          placeholders: {name: HotMC}
          lore:
            - votes:gui.site-status-open
            - {ref: votes:gui.site-total, placeholders: {total: '0'}}
            - votes:gui.spacer
            - votes:gui.site-history-title
            - votes:gui.site-history-empty
            - votes:gui.spacer
            - votes:gui.site-action
        - slot: 15
          material: EMERALD
          name: votes:sites.monitoring-minecraft
          placeholders: {name: MonitoringMinecraft}
          lore:
            - votes:gui.site-status-voted
            - {ref: votes:gui.site-total, placeholders: {total: '7'}}
            - votes:gui.spacer
            - votes:gui.site-history-title
            - {ref: votes:gui.site-history-row, placeholders: {date: '29.08.2026 в 11:05'}}
            - votes:gui.spacer
            - votes:gui.site-action

    - id: vote-sites-history-unavailable
      title: votes:gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - {slot: 11, material: GOLD_INGOT, name: votes:sites.minecraft-rating, lore: [votes:gui.site-history-unavailable, votes:gui.spacer, votes:gui.site-action], placeholders: {name: MinecraftRating}}
        - {slot: 13, material: REDSTONE, name: votes:sites.hotmc, lore: [votes:gui.site-history-unavailable, votes:gui.spacer, votes:gui.site-action], placeholders: {name: HotMC}}
        - {slot: 15, material: EMERALD, name: votes:sites.monitoring-minecraft, lore: [votes:gui.site-history-unavailable, votes:gui.spacer, votes:gui.site-action], placeholders: {name: MonitoringMinecraft}}
