  monitoring_minecraft: '<#43d995><underlined>MonitoringMinecraft</underlined></color>'
  monitoring_minecraft_state: '<#8fe1c2><bold>✔</bold></color>'
  game_monitoring: '<#b784ff><underlined>GameMonitoring</underlined></color>'
  game_monitoring_state: '<#ffc98c>◇</color>'
  site: '<#ff5f56>HotMC</color>'
  fields: ': http.port'
  amount: '1000'
  rewards: '<#4de3a2>+1000</color> <white>💰</white> <#ffd166>+3</color> <white></white>'
  mysql: '<#2bba43>✔ работает</color>'
  reward: '<#2bba43>✔ работает</color>'
