schema: 1
plugin: ArcVotes
minecraft-version: '1.21.11'
minecraft-client-sha1: ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd
gallery-accent: '#ffb86b'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

glyphs:
  - character: '💰'
    path: '@pack/assets/arc/textures/glyphs/coin.png'
    height: 9
    ascent: 8
  - character: ''
    path: '@pack/assets/arc/textures/glyphs/premium_token.png'
    height: 9
    ascent: 8

sources:
  votes:
    path: src/main/resources/lang/ru.yml
    prefix-key: prefix
    exclude: [prefix, commands.vote-state-voted, commands.vote-state-open, reward.component-standard, reward.component-premium, reward.component-separator]

placeholders:
  name: MonitoringMinecraft
  minecraft_rating: '<#ffc857><underlined>MinecraftRating</underlined></color>'
  minecraft_rating_state: '<#8fe1c2><bold>✔</bold></color>'
  hotmc: '<#ff5f56><underlined>HotMC</underlined></color>'
  hotmc_state: '<#ffc98c>◇</color>'
  monitoring_minecraft: '<#43d995><underlined>MonitoringMinecraft</underlined></color>'
  monitoring_minecraft_state: '<#8fe1c2><bold>✔</bold></color>'
  game_monitoring: '<#b784ff><underlined>GameMonitoring</underlined></color>'
  game_monitoring_state: '<#ffc98c>◇</color>'
  site: '<#ff5f56>HotMC</color>'
  amount: '1000'
  rewards: '<#4de3a2>+1000</color> <white>💰</white> <#ffc98c>·</color> <#ffd166>+3</color> <white></white>'
  http: '<#8fe1c2><bold>✓ ВКЛ</bold></color>'
  mysql: '<#8fe1c2><bold>✓ ВКЛ</bold></color>'
  reward: '<#ff8f7a><bold>— ВЫКЛ</bold></color>'
  minecraft_rating_status: '<#8fe1c2><bold>✓ ВКЛ</bold></color>'
  hotmc_status: '<#8fe1c2><bold>✓ ВКЛ</bold></color>'
  monitoring_minecraft_status: '<#ff8f7a><bold>— ВЫКЛ</bold></color>'
  game_monitoring_status: '<#8fe1c2><bold>✓ ВКЛ</bold></color>'
  accepted: '128'
  duplicates: '7'
  rejected: '3'
  upstream_failures: '1'

surfaces:
  fragments:
    - source: votes
      include: [sites.*]

  chat:
    - source: votes
      include:
        - commands.*
        - reward.granted
