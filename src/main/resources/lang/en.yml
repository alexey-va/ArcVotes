prefix: '<#ffb86b><bold>Votes</bold></color> <#ff8fa3>·</color>'
sites:
  minecraft-rating: '<#ffc857><name></color>'
  hotmc: '<#ff5f56><name></color>'
  monitoring-minecraft: '<#43d995><name></color>'
  game-monitoring: '<#b784ff><name></color>'
commands:
  vote-list:
    - '<reset>'
    - '<prefix> <#fff4e3>Support the server on four voting sites:</color>'
    - '<minecraft_rating_state> <minecraft_rating> <#ffe0bd>— open</color>'
    - '<hotmc_state> <hotmc> <#ffe0bd>— open</color>'
    - '<monitoring_minecraft_state> <monitoring_minecraft> <#ffe0bd>— open</color>'
    - '<game_monitoring_state> <game_monitoring> <#ffe0bd>— open</color>'
    - '<reset>'
  reward-note: |-
    <#ffd9b3>Enter your in-game name on the site.</color>
      <#fff4e3>The reward will arrive automatically.</color>
  vote-state-voted: '<#4de3a2>✔</color>'
  vote-state-open: '<#ffc98c>◇</color>'
  open-hint: '<#fff4e3>Click to open <site></color>'
  no-permission: '<prefix> <#ff8f7a>You do not have permission.</color>'
  help: '<prefix> <#fff4e3>Usage:</color> <#ffcf70>/vote</color>'
  admin-help:
    - '<prefix> <#e6fff3>Administrator commands</color>'
    - '  <#92bed8>/vote status</color> <#8c8c8c>·</color> <#92bed8>/vote check player</color>'
    - '  <#92bed8>/vote history player [page]</color>'
  state-enabled: '<#2bba43>✔ working</color>'
  state-disabled: '<#c42323>✘ not working</color>'
  reload-success: '<prefix> <#4de3a2>Vote settings were reloaded.</color>'
  reload-failed: '<prefix> <#ff8f7a>Vote settings were not reloaded.</color>'
  reload-restart-required: '<prefix> <#ffc98c>Restart required<fields>.</color>'
  reload-busy: '<prefix> <#ffc98c>A reload is already in progress.</color>'
  reload-help: '<prefix> <#fff4e3>Usage:</color> <#ffcf70>/arcvotes reload</color>'
  status:
    - '<#92bed8>Admin</color> <#666666>·</color> <#e6fff3>Votes</color>'
    - '  <#8c8c8c>MySQL:</color> <mysql>'
    - '  <#8c8c8c>Rewards:</color> <reward>'
  status-ingress:
    - '<#92bed8>Admin</color> <#666666>·</color> <#e6fff3>Votes</color>'
    - '  <#8c8c8c>MySQL:</color> <mysql>'
    - '  <#8c8c8c>Rewards:</color> <reward>'
    - '  <#8c8c8c>Vote intake:</color> <callback>'
    - '  <#8c8c8c>Sources:</color> <#e6fff3><source_count></color>'
  counters:
    - '  <#8c8c8c>Accepted:</color> <#e6fff3><accepted></color> <#666666>·</color> <#8c8c8c>duplicates:</color> <#e6fff3><duplicates></color>'
    - '  <#8c8c8c>Rejected:</color> <#e6fff3><rejected></color> <#666666>·</color> <#8c8c8c>API failures:</color> <#e6fff3><upstream_failures></color>'
  player-check:
    - '<prefix> <#e6fff3>Player <#92bed8><player></color></color>'
    - '  <#8c8c8c>Active votes:</color> <#e6fff3><voted_count> of <total_count></color>'
    - '  <minecraft_rating_state> <#e6fff3><check_minecraft_rating></color>'
    - '  <hotmc_state> <#e6fff3><check_hotmc></color>'
    - '  <monitoring_minecraft_state> <#e6fff3><check_monitoring_minecraft></color>'
    - '  <game_monitoring_state> <#e6fff3><check_game_monitoring></color>'
  history-header:
    - '<prefix> <#e6fff3>History <#92bed8><player></color></color>'
    - '  <#8c8c8c>Total:</color> <#e6fff3><count></color> <#666666>·</color> <#8c8c8c>page <page> of <pages></color>'
  history-row: '  <#8c8c8c><index>.</color> <#969696><date></color> <#666666>·</color> <#e6fff3><history_site></color> <#666666>·</color> <history_state>'
  history-state-granted: '<#2bba43>✔ granted</color>'
  history-state-pending: '<#ff9f0f>⌚ pending</color>'
  history-state-recovery: '<#c42323>⚠ review</color>'
  history-state-none: '<#969696>— no reward</color>'
  history-previous: '<#92bed8><underlined>◀ Previous</underlined></color>'
  history-previous-disabled: '<#666666>◀ Previous</color>'
  history-next: '<#92bed8><underlined>Next ▶</underlined></color>'
  history-next-disabled: '<#666666>Next ▶</color>'
  history-navigation: '  <previous> <#666666>·</color> <#969696><page>/<pages></color> <#666666>·</color> <next>'
  history-page-hint: '<#e6fff3>Open page <page></color>'
  history-empty: '<prefix> <#969696><#e6fff3><player></color> has no recorded votes yet.</color>'
  player-invalid: '<prefix> <#c42323>Invalid player name:</color> <#e6fff3><player></color>'
  storage-unavailable: '<prefix> <#c42323>The vote database is unavailable.</color>'
  lookup-failed: '<prefix> <#c42323>Could not read vote data.</color>'
  page-invalid: '<prefix> <#c42323>Page must be between 1 and <maximum>.</color>'
  page-not-found: '<prefix> <#c42323>That page does not exist.</color> <#969696>Total: <pages>.</color>'
reward:
  granted:
    - '<prefix> <#fff4e3>Your <site> vote was recorded.</color>'
    - '  <rewards>'
  component-standard: '<#4de3a2>+<amount></color> <white>💰</white>'
  component-premium: '<#ffd166>+<amount></color> <white></white>'
  component-separator: ' <#ffc98c>·</color> '
