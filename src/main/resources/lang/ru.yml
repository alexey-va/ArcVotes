    - '<#ff8fa3><bold>Мониторинги</bold></color>'
    - '  <#ffc857>◆ MinecraftRating</color> <minecraft_rating_status>'
    - '  <#ff5f56>◆ HotMC</color> <hotmc_status>'
    - '  <#43d995>◆ MonitoringMinecraft</color> <monitoring_minecraft_status>'
    - '  <#b784ff>◆ GameMonitoring</color> <game_monitoring_status>'
  counters:
    - '<#ff8fa3><bold>Callback-события</bold></color>'
