    - '<#ffd9b3>Отклонено:</color> <rejected> <#ff8fa3>·</color> <#ffd9b3>ошибок API:</color> <upstream_failures>'
reward:
  granted:
    - '<prefix> <#fff4e3>Голос на <site> засчитан.</color>'
    - '  <rewards>'
  component-standard: '<#4de3a2>+<amount></color> <white>💰</white>'
  component-premium: '<#ffd166>+<amount></color> <white></white>'
  component-separator: ' <#ffc98c>·</color> '
