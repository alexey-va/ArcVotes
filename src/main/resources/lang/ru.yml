  reward-note: |-
    <#ffd9b3>На сайте укажите свой игровой ник.</color>
      <#fff4e3>Награда придёт автоматически.</color>
  vote-state-voted: '<#4de3a2><bold>✔</bold></color>'
  vote-state-open: '<#ffc98c>◇</color>'
