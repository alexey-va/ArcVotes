  state-disabled: '<#ff8f7a><bold>— ВЫКЛ</bold></color>'
  status:
    - '<prefix> <#fff4e3><bold>Состояние сервиса</bold></color>'
    - '  <#ffcf70>•</color> <#fff4e3>HTTP-приёмник</color> <http>'
    - '  <#ffcf70>•</color> <#fff4e3>MySQL</color> <mysql>'
