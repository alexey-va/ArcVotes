prefix: '<#ffb86b><bold>Голоса</bold></color> <#ff8fa3>·</color>'
sites:
  minecraft-rating: '<#ffc857><name></color>'
  hotmc: '<#ff5f56><name></color>'
  monitoring-minecraft: '<#43d995><name></color>'
  game-monitoring: '<#b784ff><name></color>'
commands:
  vote-list:
    - '<reset>'
    - '<prefix> <#fff4e3>Поддержите сервер на четырёх сайтах:</color>'
