    - '<hotmc_state> <hotmc> <#ffe0bd>— открыть</color>'
    - '<monitoring_minecraft_state> <monitoring_minecraft> <#ffe0bd>— открыть</color>'
    - '<game_monitoring_state> <game_monitoring> <#ffe0bd>— открыть</color>'
