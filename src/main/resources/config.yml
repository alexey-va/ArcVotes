# ArcVotes starts in link-only mode. Enable MySQL and the callback listener only
# after the reverse-proxy route and secret environment variables are ready.
# Apply safe changes with /arcvotes reload. server-id and mysql are restart-only.
# Active listener bind/port/worker/queue changes require a restart, or a
# disable+reload followed by edit+enable+reload. Every other field is live.
server-id: survival

locale:
  default: ru
  use-client-locale: false

http:
  enabled: false
  # Feature ingress is intentionally loopback-only. TLS and public routing belong
  # to the managed reverse proxy.
  bind-address: 127.0.0.1
  # These three capacity/socket fields and bind-address are fixed while an
  # enabled listener is running. Body/header/timeouts/trust below are live.
  port: 9187
  worker-threads: 2
  queue-capacity: 64
  maximum-body-bytes: 16384
  maximum-header-count: 32
  maximum-header-bytes: 8192
  maximum-header-value-bytes: 4096
  persistence-timeout-ms: 10000
  trust-single-forwarded-client-ip: true

mysql:
  # The whole MySQL block is restart-only because it owns the durable ledger.
  enabled: false
  host: mysql
  port: 3306
  database: minecraft
  username: minecraft
  password-env: ARC_VOTES_MYSQL_PASSWORD
  ssl-mode: DISABLED
  minimum-idle: 1
  maximum-pool-size: 4
  connection-timeout-ms: 10000
  socket-timeout-ms: 30000
  validation-timeout-ms: 5000
  max-lifetime-ms: 1700000
  fail-fast: true

reward:
  enabled: false
  # Legacy keys remain during rolling upgrades; ArcVotes 0.2+ reads the
  # component-specific settings below.
  amount: 1000.00
  currency-label: монет
  poll-interval-seconds: 5
  maximum-pending-per-player: 16
  maximum-online-player-batch: 500
  standard:
    enabled: true
    amount: 1000.00
  premium:
    enabled: true
    currency-id: tokens
    amount: 3.00

status:
  # Time zone used only to render timestamps in /vote history.
  vote-day-zone: Europe/Moscow
  cache-ttl-seconds: 30
  maximum-cache-entries: 2048
  # Admin /vote history pagination. Both fields update live with /arcvotes reload.
  history-page-size: 8
  history-maximum-pages: 1000

monitorings:
  minecraft-rating:
    enabled: false
    display-name: MinecraftRating
    vote-url: https://minecraftrating.ru/projects/rus-crafting/
    secret-env: ARC_VOTES_MINECRAFT_RATING_SECRET
    maximum-age-seconds: 691200
    maximum-future-skew-seconds: 300
    enforce-ip-allowlist: false
    allowed-ips: []

  hotmc:
    enabled: false
    display-name: HotMC
    vote-url: https://hotmc.ru/vote-242482
    secret-env: ARC_VOTES_HOTMC_SECRET
    maximum-age-seconds: 691200
    maximum-future-skew-seconds: 300
    enforce-ip-allowlist: true
    # Current sender addresses published in the HotMC owner panel.
    allowed-ips:
      - 176.108.255.82
      - 109.207.174.67
      - 31.44.5.3

  monitoring-minecraft:
    enabled: false
    display-name: MonitoringMinecraft
    vote-url: https://monitoringminecraft.com/vote/43/
    secret-env: ARC_VOTES_MONITORING_MINECRAFT_SECRET
    expected-server-id: '43'
    maximum-age-seconds: 691200
    maximum-future-skew-seconds: 300
    enforce-ip-allowlist: false
    allowed-ips: []

  game-monitoring:
    enabled: false
    display-name: GameMonitoring
    vote-url: https://gamemonitoring.ru/minecraft/servers/14210383/vote
    webhook-token-env: ARC_VOTES_GAME_MONITORING_WEBHOOK_TOKEN
    expected-entity-type: server
    # Current server/API entity id from the owner page.
    expected-entity-id: '14210383'
    connect-timeout-ms: 3000
    request-timeout-ms: 4000
    maximum-response-bytes: 32768
    api-base-url: https://api.gamemonitoring.ru/votes/
    enforce-ip-allowlist: false
    allowed-ips: []
