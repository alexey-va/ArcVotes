name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .codex/**
      - src/test/e2e/**
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .codex/**
      - src/test/e2e/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: alexey-va/arc-core/.github/actions/verify-consumer@cd6968209a40ad80841b14cf434a234edc08922d
      - run: ./gradlew --no-daemon test shadowJar --build-cache
      - name: Retain production plugin JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcVotes-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/libs/ArcVotes-*.jar
            !build/libs/*-plain.jar

  integration:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify Docker daemon
        run: docker info
      - run: ./gradlew --no-daemon integrationTest

  e2e:
    name: Real Paper E2E (Plugwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIMEOUT: "60000"
      ARC_VOTES_MYSQL_PASSWORD: minecraft
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: minecraft
          MYSQL_USER: minecraft
          MYSQL_PASSWORD: minecraft
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexey-va/ARC
          ref: 2e76378c7b329fc654cba108bb02cd5bafdb2f22
          path: e2e-arc
      - name: Build ARC provider dependency
        run: ./gradlew --no-daemon shadowJar
        working-directory: e2e-arc
      - name: Run ArcVotes on real Paper
        run: |
          set -o pipefail
          ARC_VOTES_MONITORING_MINECRAFT_SECRET="$(openssl rand -hex 32)"
          export ARC_VOTES_MONITORING_MINECRAFT_SECRET
          mkdir -p build
          mapfile -t arc_jars < <(find e2e-arc/build/libs -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' -print | sort)
          test "${#arc_jars[@]}" -eq 1
          ./gradlew --no-daemon plugwrightTest "-Pe2eArcJar=${arc_jars[0]}" 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Upload Paper E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcvotes-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
